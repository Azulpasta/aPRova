name: ci

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VERSAO_GITLEAKS: "8.30.1"
  VERSAO_GOLANGCI_LINT: "v2.13.2"
  VERSAO_GOVULNCHECK: "v1.8.0"
  VERSAO_MIGRATE: "v4.19.1"
  VERSAO_SQLC: "v1.30.0"

jobs:
  verificacao:
    name: verificacao
    runs-on: ubuntu-latest

    steps:
      - name: checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO_GITLEAKS}/gitleaks_${VERSAO_GITLEAKS}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks git . --log-opts="--all --full-history" --redact --verbose

      - name: instalar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.VERSAO_GOLANGCI_LINT }}

      - name: go build
        run: go build ./...

      - name: go test, sem a integração do sandbox
        run: go test $(go list ./... | grep -v /tests/integration) -race -covermode=atomic -coverprofile=coverage.out

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${VERSAO_GOVULNCHECK}"
          govulncheck ./...

      - name: publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.out
          if-no-files-found: warn
          retention-days: 30

  banco:
    name: banco
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aprova
          POSTGRES_PASSWORD: aprova
          POSTGRES_DB: aprova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aprova -d aprova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      URL_BANCO: postgres://aprova:aprova@localhost:5432/aprova?sslmode=disable

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: instalar golang-migrate e sqlc
        run: |
          go install -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${VERSAO_MIGRATE}"
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${VERSAO_SQLC}"

      - name: migrations sobem num postgres limpo
        run: migrate -path migrations -database "$URL_BANCO" up

      - name: migrations descem até zero
        run: migrate -path migrations -database "$URL_BANCO" down -all

      - name: nada sobrou depois do down
        run: |
          sobras=$(psql "$URL_BANCO" -Atc "
            SELECT count(*) FROM (
              SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename <> 'schema_migrations'
              UNION ALL
              SELECT p.proname FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND NOT EXISTS (
                SELECT 1 FROM pg_depend d WHERE d.objid = p.oid AND d.deptype = 'e')
              UNION ALL
              SELECT extname FROM pg_extension WHERE extname <> 'plpgsql'
            ) objetos")
          echo "objetos que sobraram: $sobras"
          test "$sobras" = "0"

      - name: sqlc generate sem diff
        run: |
          sqlc generate
          git add -N internal/repository/db
          git diff --exit-code -- internal/repository/db

      - name: integração com o postgres (testcontainers)
        env:
          CI: "true"
        run: go test ./tests/integration/postgres/... -race -count=1 -v

  mudancas:
    name: mudancas
    runs-on: ubuntu-latest
    outputs:
      sandbox: ${{ steps.filtro.outputs.sandbox }}

    steps:
      - name: checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: instalar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: o sandbox mudou?
        id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            faixa="origin/$BASE...HEAD"
          elif [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            faixa="$ANTES..$DEPOIS"
          else
            echo "sem base de comparação confiável, a integração roda"
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only -z "$faixa" > mudancas.txt
          resultado=$(go run ./scripts/mudou-sandbox < mudancas.txt)
          echo "arquivos alterados em $faixa:"
          tr '\0' '\n' < mudancas.txt
          echo "sandbox=$resultado" >> "$GITHUB_OUTPUT"

  integracao-sandbox:
    name: integracao-sandbox
    needs: mudancas
    if: needs.mudancas.outputs.sandbox == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: integração com a imagem real do sandbox
        run: go test ./tests/integration -race -count=1 -v

  sandbox:
    name: sandbox
    needs: [mudancas, integracao-sandbox]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: a integração do sandbox passou ou não era necessária
        env:
          MUDANCAS: ${{ needs.mudancas.result }}
          INTEGRACAO: ${{ needs.integracao-sandbox.result }}
        run: |
          echo "mudancas=$MUDANCAS integracao-sandbox=$INTEGRACAO"
          if [ "$MUDANCAS" != "success" ]; then
            echo "não foi possível decidir se o sandbox mudou, então a integração não pode ser dada como dispensável"
            exit 1
          fi
          case "$INTEGRACAO" in
            success | skipped) ;;
            *)
              echo "a integração do sandbox terminou em $INTEGRACAO"
              exit 1
              ;;
          esac
