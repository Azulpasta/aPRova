name: ci

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VERSAO_GO: "1.25.0"
  VERSAO_GITLEAKS: "8.30.1"
  VERSAO_GOLANGCI_LINT: "v2.13.2"
  VERSAO_GOVULNCHECK: "v1.8.0"

jobs:
  verificacao:
    name: verificacao
    runs-on: ubuntu-latest

    steps:
      - name: checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO_GITLEAKS}/gitleaks_${VERSAO_GITLEAKS}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks git . --log-opts="--all --full-history" --redact --verbose

      - name: instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.VERSAO_GO }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.VERSAO_GOLANGCI_LINT }}

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${VERSAO_GOVULNCHECK}"
          govulncheck ./...

      - name: publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.out
          if-no-files-found: warn
          retention-days: 30
