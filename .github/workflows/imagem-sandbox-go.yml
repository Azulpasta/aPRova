name: imagem-sandbox-go

on:
  push:
    branches:
      - main
    paths:
      - imagens/go/**
      - cmd/sandbox/**
      - internal/sandbox/**
      - go.mod
      - go.sum
      - .dockerignore
      - .github/workflows/imagem-sandbox-go.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: imagem-sandbox-go
  cancel-in-progress: false

jobs:
  publicar:
    name: publicar
    runs-on: ubuntu-latest

    env:
      IMAGEM: ${{ vars.ACR_NOME }}.azurecr.io/aprova-sandbox-go:${{ github.sha }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login na azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: login no registro
        run: az acr login --name "${{ vars.ACR_NOME }}"

      - name: construir
        run: docker build -f imagens/go/Dockerfile -t "$IMAGEM" .

      - name: publicar
        run: docker push "$IMAGEM"

      - name: registrar tamanho
        run: |
          tamanho=$(docker image inspect "$IMAGEM" --format '{{.Size}}')
          {
            echo "### aprova-sandbox-go"
            echo ""
            echo "- imagem: \`$IMAGEM\`"
            echo "- tamanho descomprimido: $((tamanho / 1024 / 1024)) MB"
          } >> "$GITHUB_STEP_SUMMARY"
