name: aprova

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aprova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aprova
      POSTGRES_PASSWORD: aprova
      POSTGRES_DB: aprova
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprova -d aprova"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aprova-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dados-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  dados-postgres:
  dados-redis:
